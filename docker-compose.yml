services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      SV_DB_PATH: /data/swarvani.db
    volumes:
      - swarvani-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  swarvani-data:
